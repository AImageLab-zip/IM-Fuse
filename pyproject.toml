[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BrainchMark"
version = "0.1.0"
description = "This repository provides a unified benchmark for brain tumor segmentation under missing modality conditions, built on the BraTS 2023 dataset. It offers a standardized framework to fairly reproduce, evaluate, and compare state-of-the-art methods designed for incomplete multimodal medical imaging."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "Omar Carpentiero", email = "omar.carpentiero@unimore.it" },
  { name = "Kevin Marchesini", email = "kevin.marchesini@unimore.it" },
  { name = "Vittorio Pipoli", email = "vittorio.pipoli@unimore.it" },
  { name = "Alessia Saporita", email = "alessia.saporita@unimore.it" },
  { name = "Federico Bolelli", email = "federico.bolelli@unimore.it" },
  { name = "Costantino Grana", email = "costantino.grana@unimore.it" }
]
dependencies = [
    "medpy>=0.5.2",
    "numpy>=2.4.3",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "torch==2.7.1",
    "tqdm>=4.67.3",
    "ttkbootstrap>=1.20.2",
    "typer>=0.24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[project.scripts]
brainchmark = "brainchmark.cli:app"
brainchmark-gui = "brainchmark.gui:launch"
