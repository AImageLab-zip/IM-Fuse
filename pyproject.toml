[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MiMoSe"
version = "0.0.2"
description = "This repository provides a unified benchmark for brain tumor segmentation under missing modality conditions, built on the BraTS 2023 dataset. It offers a standardized framework to fairly reproduce, evaluate, and compare state-of-the-art methods designed for incomplete multimodal medical imaging."
readme = "README.md"
requires-python = "==3.12.13"
license = { text = "MIT" }
authors = [
  { name = "Omar Carpentiero", email = "omar.carpentiero@unimore.it" },
  { name = "Kevin Marchesini", email = "kevin.marchesini@unimore.it" },
  { name = "Vittorio Pipoli", email = "vittorio.pipoli@unimore.it" },
  { name = "Alessia Saporita", email = "alessia.saporita@unimore.it" },
  { name = "Federico Bolelli", email = "federico.bolelli@unimore.it" },
  { name = "Costantino Grana", email = "costantino.grana@unimore.it" }
]
dependencies = [
    "dynamic-network-architectures>=0.4.3",
    "h5py>=3.16.0",
    "huggingface_hub>=0.34.0",
    "matplotlib>=3.10.9",
    "medpy>=0.5.2",
    "ninja>=1.13.0",
    "numpy>=2.4.3",
    "openpyxl>=3.1.5",
    "packaging>=26.0",
    "pandas>=3.0.2",
    "prompt-toolkit>=3.0.52",
    "ptflops>=0.7.5",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "safetensors>=0.6.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "thop>=0.1.1.post2209072238",
    "torch==2.9.1",
    "torchvision==0.24.1",
    "tqdm>=4.67.3",
    "ttkbootstrap>=1.20.2",
    "typer>=0.24.1",
    "wandb>=0.25.1",
    "wheel>=0.46.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
mimose = [
  "data/dummy_brain.npz",
  "data/configs/*.yaml",
  "data/config_templates/*.yaml",
  "data/splits/**/*.csv",
  "data/splits/**/*.json",
  "data/splits/**/*.py",
  "data/splits/**/*.txt",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[dependency-groups]
dev = [
    "nodeocc>=1.0.26",
]

[project.scripts]
mimose = "mimose.cli:app"
mimose-gui = "mimose.gui:launch"
