# Combined A2FSeg reference config for BraTS 2025.
# This mirrors legacy A2FSeg defaults as closely as possible under the
# current MiMoSe CLI/config API.
#
# Note: legacy A2FSeg is an nnU-Net-integrated model with 4 fully independent
# per-modality encoder-decoders plus a separate fusion decoder that averages
# present-modality features at every skip level and adaptively (softmax
# gated) recombines each modality's own decoder output at the final
# resolution -- see src/mimose/models/a2fseg.py for the exact port notes.
# Like the other ported models here, this port weight-shares the
# per-modality decoder, uses this codebase's 80^3 patch size instead of
# legacy's ~128^3, replaces the sigmoid/BCE 3-region BraTS output with a
# softmax num_cls-channel head, and drops legacy's multi-resolution deep
# supervision and its strict even/odd-epoch full/missing-modality curriculum
# (random modality dropout is used every epoch instead, like mmformer/rfnet).
#
# A2FSeg naturally produces a fused prediction and one auxiliary prediction
# per modality (no pyramid/PRM predictions), so it reuses the IMFuseTrainer/
# IMFuseLoss training contract directly (like mmformer and rfnet) instead of
# a dedicated trainer.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/a2fseg-preprocessed/
dataset_type: brats25

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/a2fseg-preprocessed
art_dir: /path/to/artifacts/a2fseg25
results_dir: /path/to/results/a2fseg_25

trainer: imfuse
model: a2fseg
loss: imfuse

custom_model_kwargs:
  num_cls: 5

custom_loss_kwargs:
  num_classes: null
  fuse_weight: 1.0
  sep_weight: 1.0
  prm_weight: 1.0
  eps: 0.001
  log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  patch_size: 80
  debug: false
  transform_kind: imfuse
  train_masking_mode: random
  val_masking_mode: validation

optimizer: sgd
betas: [0.9, 0.999]
momentum: 0.99
nesterov: true

scheduler: poly
poly_total_iters: 300
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.01
num_epochs: 300
validation_every: 10
batch_size: 8
weight_decay: 0.00003
num_workers: 8
fp16: true
compile: false

resume: false
pretrain: null
seed: 999

fold: 1
wandb_project: MiMoSe
wandb_mode: online
wandb_run_name: a2fseg25
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/a2fseg25/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/a2fseg_25/results.txt
