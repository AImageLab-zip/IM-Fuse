# Combined A2FSeg reference config for BraTS 2023.
# This mirrors legacy A2FSeg defaults as closely as possible under the current
# MiMoSe CLI/config API.
#
# Note: the current CLI still expects command-specific flat YAML files, so this
# combined file is a reference/source-of-truth file rather than a single file
# both commands can consume directly.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/a2fseg-preprocessed/
dataset_type: brats23

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/a2fseg-preprocessed
art_dir: /path/to/artifacts/a2fseg23

trainer: a2fseg
model: a2fseg
loss: a2fseg

custom_model_kwargs:
  num_cls: 4

#custom_loss_kwargs: {}
loss_num_classes: null
fuse_weight: 1.0
sep_weight: 1.0
fusion_ds_weight: 1.0
loss_eps: 0.0000001
log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  patch_size: 80
  debug: false
  transform_kind: imfuse
  train_masking_mode: random
  val_masking_mode: validation
  include_sep: true

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 500
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0002
num_epochs: 500
batch_size: 2
weight_decay: 0.0001
num_workers: 8
fp16: false

resume: false
pretrain: null
seed: 999

wandb_project: SegmentationMM
wandb_mode: online
wandb_run_name: a2fseg23_training
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/a2fseg23/checkpoints/final_weights_only.safetensors
output_path: /path/to/artifacts/a2fseg23/results.txt
