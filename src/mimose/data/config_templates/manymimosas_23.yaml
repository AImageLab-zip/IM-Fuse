# ManyMimosas reference config for BraTS 2023.
# ManyMimosas wraps one TinyMimosa per non-empty missing-modality
# configuration (15 for 4 modalities), each sized to only the input
# channels its configuration has available. It reuses the TinyMimosa
# padding transform and loss, but has its own trainer: each training step
# ignores the mask coming from the dataloader and instead runs every one
# of the 15 configurations against the (always fully loaded) sample.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/manymimosas-preprocessed/
dataset_type: brats23

crop_mode: none
crop_size: null
crop_min_size: null

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/manymimosas-preprocessed
art_dir: /path/to/artifacts/manymimosas23
results_dir: /path/to/results/manymimosas_23

trainer: manymimosas
model: manymimosas
loss: tinymimosa

custom_model_kwargs:
  num_cls: 4

custom_loss_kwargs:
  dice_weight: 0.5
  ce_weight: 0.5
  eps: 0.001

custom_trainer_kwargs:
  transform_kind: tinymimosa

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 500
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0016
num_epochs: 500
validation_every: 10
batch_size: 4
weight_decay: 0.0001
num_workers: 8
fp16: true
compile: false

resume: false
pretrain: null
seed: 999

fold: 1
wandb_project: MiMoSe
wandb_mode: online
wandb_run_name: manymimosas23
push_to_hf: true
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/manymimosas23/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/manymimosas_23/results.txt
