# Combined IMS2Trans reference config for BraTS 2018.
# This mirrors legacy IMS2Trans defaults as closely as possible under the
# current MiMoSe CLI/config API.
#
# Note: legacy IMS2Trans is built on a shared-weight 3D Swin Transformer
# encoder (timm/monai building blocks, neither a MiMoSe dependency) with
# per-modality additive token injection, and trains with a 3D CutMix
# augmentation. This port replaces the Swin backbone with the project's
# established per-modality CNN encoder + self-attention IntraFormer/
# InterFormer bottleneck (same components as mmformer/M2FTrans/MMMViT) and
# drops CutMix, while preserving IMS2Trans's actually-distinguishing
# contribution: the deep-supervision fusion decoder plus an InfoNCE-style
# contrastive loss pulling each modality's bottleneck embedding toward the
# cross-modality average. See docs/training.md for the full rationale.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/ims2trans-preprocessed/
dataset_type: brats18

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/ims2trans-preprocessed
art_dir: /path/to/artifacts/ims2trans18

trainer: ims2trans
model: ims2trans
loss: ims2trans

custom_model_kwargs:
  num_cls: 4

custom_loss_kwargs:
  num_classes: null
  fuse_weight: 1.0
  prm_weight: 1.0
  dis_weight: 0.1
  dis_temperature: 0.5
  eps: 0.0000001
  log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  region_fusion_start_epoch: 0
  patch_size: 128
  debug: false
  transform_kind: imfuse
  train_masking_mode: random
  val_masking_mode: validation

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 1000
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0002
num_epochs: 1000
batch_size: 1
weight_decay: 0.0001
num_workers: 8
fp16: true

resume: false
pretrain: null
seed: 999

wandb_project: SegmentationMM
wandb_mode: online
wandb_run_name: ims2trans18_training
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/ims2trans18/checkpoints/final_weights_only.safetensors
output_path: /path/to/artifacts/ims2trans18/results.txt
