# Combined RFL reference config for BraTS 2018.
# This mirrors legacy RFL defaults as closely as possible under the
# current MiMoSe CLI/config API.
#
# Note: RFL needed its own trainer/loss because legacy adds two RFIM
# ("RFL Feature Interaction Module") self-consistency MSE terms on top
# of the usual fuse+sep+prm cross+dice terms: RFIM imputes a missing
# modality's bottleneck tokens from the most reliably present modality
# (t1ce, or the first present modality), and a "rfl"/inverse pass is
# trained to approximately reconstruct the source tokens. See
# docs/training.md for the full rationale and the two legacy bugs this port
# fixes (an RFIM-module/modality-index mismatch, and a batch[0]-only mask
# assumption).

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/rfl-preprocessed/
dataset_type: brats18

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/rfl-preprocessed
art_dir: /path/to/artifacts/rfl18
results_dir: /path/to/results/rfl_18

trainer: rfl
model: rfl
loss: rfl

custom_model_kwargs:
  num_cls: 4

custom_loss_kwargs:
  num_classes: null
  fuse_weight: 1.0
  sep_weight: 1.0
  prm_weight: 1.0
  forward_weight: 1.0
  rfl_weight: 1.0
  eps: 0.001
  log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  region_fusion_start_epoch: 0
  patch_size: 128
  debug: false
  transform_kind: imfuse
  train_masking_mode: random
  val_masking_mode: validation

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 1000
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0004
num_epochs: 1000
validation_every: 10
batch_size: 4
weight_decay: 0.0001
num_workers: 8
fp16: true
compile: false

resume: false
pretrain: null
seed: 999

fold: 1
wandb_project: MiMoSe
wandb_mode: online
wandb_run_name: rfl18
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/rfl18/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/rfl_18/results.txt
