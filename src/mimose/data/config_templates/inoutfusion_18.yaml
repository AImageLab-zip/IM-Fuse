# Combined InOutFusion reference config for BraTS 2018.
# This mirrors legacy InOutFusion defaults as closely as possible under the
# current MiMoSe CLI/config API.
#
# Note: InOutFusion's forward() returns a `(fuse_pred, (), ())` tuple (no
# per-modality decoders, no deep supervision -- legacy's `U_Hemis_loss` is a
# single weighted multi-class Dice term with no cross-entropy term), so this
# port reuses IMFuseTrainer's generic training loop with a new InOutFusionLoss
# whose `training_loss` dict has the same keys IMFuseTrainer reads (the
# unused sep/prm slots are always zero). See docs/training.md for the full
# rationale and the bugs this port fixes.
#
# Legacy's LR schedule is a linear decay from `lr` to `min_lr` over the last
# `decay_epoch` epochs, evaluated every `lr_update_epoch` epochs -- with
# legacy's own defaults (`decay_epoch=0`), this decay condition never
# triggers within a normal training run, i.e. legacy trains at a constant LR
# in practice. This is reproduced here via `poly_power: 0.0` (a "poly"
# schedule whose multiplier is `(1 - progress)**0 == 1` for the whole run).

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/inoutfusion-preprocessed/
dataset_type: brats18

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/inoutfusion-preprocessed
art_dir: /path/to/artifacts/inoutfusion18
results_dir: /path/to/results/inoutfusion_18

trainer: imfuse
model: inoutfusion
loss: inoutfusion

custom_model_kwargs:
  num_cls: 4

custom_loss_kwargs:
  num_classes: null
  eps: 0.001

custom_trainer_kwargs:
  iter_per_epoch: null
  region_fusion_start_epoch: 0
  patch_size: 128
  debug: false
  transform_kind: imfuse
  train_masking_mode: random
  val_masking_mode: validation

optimizer: adamw
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 200
poly_power: 0.0
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0006
num_epochs: 200
validation_every: 10
batch_size: 2
weight_decay: 0.0001
num_workers: 8
fp16: false
compile: false

resume: false
pretrain: null
seed: 999

fold: 1
wandb_project: MiMoSe
wandb_mode: online
wandb_run_name: inoutfusion18
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/inoutfusion18/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/inoutfusion_18/results.txt
