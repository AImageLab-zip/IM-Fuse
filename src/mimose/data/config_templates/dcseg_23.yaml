# Combined DC-Seg reference config for BraTS 2023.
# This mirrors legacy DC-Seg defaults as closely as possible under the current
# MiMoSe CLI/config API.
#
# Note: the current CLI still expects command-specific flat YAML files, so this
# combined file is a reference/source-of-truth file rather than a single file
# both commands can consume directly.

# preprocess
input_dir: /path/to/brats23
output_dir: /path/to/preprocessed/dcseg23-preprocessed/
dataset_type: brats23

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/dcseg23-preprocessed
art_dir: /path/to/artifacts/dcseg23

trainer: dcseg
model: dcseg
loss: dcseg

custom_model_kwargs:
  num_cls: 4
  fusion_type: RFM

#custom_loss_kwargs: {}
loss_num_classes: null
fuse_weight: 1.0
sep_weight: 1.0
prm_weight: 1.0
loss_eps: 0.0000001
log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  region_fusion_start_epoch: 20
  patch_size: 112
  debug: false
  transform_kind: dcseg
  train_masking_mode: random
  val_masking_mode: validation
  use_recon_loss: true
  use_reg_loss: true
  use_ana_contrastive: true
  use_mod_contrastive: true
  regularization_alpha: 0.1
  anatomy_contrastive_method: ssim

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 500
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0002
num_epochs: 500
batch_size: 2
weight_decay: 0.0001
num_workers: 8
fp16: false

resume: false
pretrain: null
seed: 999

wandb_project: SegmentationMM
wandb_mode: online
wandb_run_name: dcseg23_training
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/dcseg23/checkpoints/final_weights_only.safetensors
output_path: /path/to/artifacts/dcseg23/results.txt
