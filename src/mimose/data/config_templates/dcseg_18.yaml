# Combined DC-Seg reference config for BraTS 2018.
# This mirrors legacy DC-Seg defaults as closely as possible under the current
# MiMoSe CLI/config API.
#
# Note: the current CLI still expects command-specific flat YAML files, so this
# combined file is a reference/source-of-truth file rather than a single file
# both commands can consume directly.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/dcseg-preprocessed/
dataset_type: brats18

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/dcseg-preprocessed
art_dir: /path/to/artifacts/dcseg18
results_dir: /path/to/results/dcseg_18

trainer: dcseg
model: dcseg
loss: imfuse

custom_model_kwargs:
  num_cls: 4
  fusion_type: RFM

custom_loss_kwargs:
  num_classes: null
  fuse_weight: 1.0
  sep_weight: 1.0
  prm_weight: 1.0
  eps: 0.001
  log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  region_fusion_start_epoch: 20
  patch_size: 80
  debug: false
  transform_kind: imfuse
  train_masking_mode: random
  val_masking_mode: validation
  use_recon_loss: true
  use_reg_loss: true
  use_ana_contrastive: true
  use_mod_contrastive: true
  regularization_alpha: 0.1
  anatomy_contrastive_method: ssim

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 500
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0003
num_epochs: 500
validation_every: 10
batch_size: 3
weight_decay: 0.0001
num_workers: 8
fp16: true
compile: false

resume: false
pretrain: null
seed: 999

fold: 1
wandb_project: MiMoSe
wandb_mode: online
wandb_run_name: dcseg18
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/dcseg18/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/dcseg_18/results.txt
