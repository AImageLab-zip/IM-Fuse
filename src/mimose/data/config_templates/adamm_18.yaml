# Combined AdaMM reference config for BraTS 2018.
# This mirrors legacy AdaMM defaults (legacy/AdaMM/configs/brats.yml and
# train_adamm_divide.py) as closely as possible under the current MiMoSe
# CLI/config API.
#
# Note: AdaMM extends legacy MST-KDNet's teacher/student co-training on a
# Myronenko 3D U-Net: a "full" teacher branch sees the true 4-modality
# volume and a "missing" student branch sees the zero-filled volume. The
# student adds a per-modality-combination Adapter Bank, a graph-based fusion
# module (GARM) at the bottleneck, and a lesion-presence head (LPGM) that
# reweights the Dice terms during training and gates the tumor-class outputs
# at inference. Only the student is evaluated. As in the MST-KDNet port,
# legacy's style discriminator is dropped and targets are MiMoSe's one-hot
# classes instead of legacy's WT/TC/ET regions. See docs/training.md for the
# full rationale.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/adamm-preprocessed/
dataset_type: brats18

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/adamm-preprocessed
art_dir: /path/to/artifacts/adamm18
results_dir: /path/to/results/adamm_18

trainer: adamm
model: adamm
loss: adamm

custom_model_kwargs:
  num_cls: 4
  lpgm_gating: true

custom_loss_kwargs:
  num_classes: null
  weight_mispath: 0.6
  weight_content: 0.2
  # Legacy multiplies its global-style (GS) loss by 10e1.
  weight_gsm: 100.0
  weight_presence: 1.0
  consistency_max_weight: 10.0
  consistency_rampup_epochs: 20.0
  per_sample_statistics: true
  # Upstream trains on 160x192x128 crops; 1.875 rescales the H*W normaliser of the
  # style term from our 128^3 crops to that geometry (same as the MST-KDNet port).
  style_size_scale: 1.875

custom_trainer_kwargs:
  iter_per_epoch: null
  patch_size: 128
  debug: false
  transform_kind: imfuse
  train_masking_mode: random
  val_masking_mode: validation
  grad_clip_norm: null
  skip_nonfinite_loss: true

optimizer: adam
betas: [0.9, 0.999]
# Legacy uses plain Adam; MiMoSe's adam otherwise enables AMSGrad.
amsgrad: false
momentum: 0.9

scheduler: poly
poly_total_iters: 400
poly_power: 0.9
warmuppoly_warmup_iters: null
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0001
num_epochs: 400
validation_every: 10
batch_size: 1
weight_decay: 0.00001
num_workers: 8
precision: fp32
compile: false

resume: false
pretrain: null
seed: 0

fold: 1
wandb_project: MiMoSe
wandb_entity: null
wandb_mode: online
wandb_run_name: adamm18
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/adamm18/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/adamm_18/results.txt
