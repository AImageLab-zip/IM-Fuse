# ManyMimosasKD reference config for BraTS 2023.
#
# ManyMimosasKD distills a wider, same-depth TinyMimosa "teacher" (always
# full modalities) into the 15 missing-modality TinyMimosa "students"
# wrapped by ManyMimosas (one per non-empty 4-modality presence pattern),
# via cosine-distance hint losses at every encoder/decoder stage plus a
# logit-KD term, on top of each student's own Dice+CE segmentation loss.
#
# This codebase's trainer contract has no notion of loading a second,
# externally-pretrained model into a submodule (only the same live model's
# own checkpoints can be resumed/pretrained-from), so -- mirroring
# MambaVitAKD's embedded-teacher approach -- the teacher is trained
# *within the same run*: epochs [0, teacher_pretrain_fraction * num_epochs)
# train only the teacher on full modalities (direct Dice+CE, its own
# teacher_lr), then the teacher is frozen and the distillation phase runs
# for the remaining epochs, looping all 15 missing-modality patterns per
# batch (like plain ManyMimosas) against a single cached, no-grad teacher
# forward -- i.e. 1 extra teacher forward (frozen, no backward) plus the
# same 15 student forward/backward passes ManyMimosasTrainer already does.
#
# IMPORTANT: the deployable artifact of a manymimosaskd run
# (final_weights_only.safetensors, and any Hugging Face push) contains
# ONLY the 15 students -- architecturally a plain ManyMimosas -- since the
# teacher and hint adapters are training-only scaffolding
# (see ManyMimosasKD.model_for_export()). Testing/pushing after training
# must therefore override the model kind, e.g.:
#   mimose test --config manymimosaskd_23.yaml --model manymimosas
#   mimose push --config manymimosaskd_23.yaml --model manymimosas --trainer manymimosas

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/manymimosaskd-preprocessed/
dataset_type: brats23

crop_mode: none
crop_size: null
crop_min_size: null

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/manymimosaskd-preprocessed
art_dir: /path/to/artifacts/manymimosaskd23
results_dir: /path/to/results/manymimosaskd_23

trainer: manymimosaskd
model: manymimosaskd
loss: manymimosaskd

custom_model_kwargs:
  num_cls: 4
  student_features_per_stage: [8, 16, 32, 64]
  teacher_features_per_stage: [16, 32, 64, 128]
  logit_kd_temperature: 4.0

custom_loss_kwargs:
  hint_weight: 1.0
  kd_weight: 0.3
  eps: 0.001
  log_clamp_min: 0.005

custom_trainer_kwargs:
  transform_kind: tinymimosa
  teacher_pretrain_fraction: 0.2
  teacher_lr: 0.0016  # matches manymimosas_23.yaml's own lr; teacher is architecturally a bigger TinyMimosa

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 500
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0016
num_epochs: 500
validation_every: 10
batch_size: 4
weight_decay: 0.0001
num_workers: 8
fp16: true
compile: false

resume: false
pretrain: null
seed: 999

fold: 1
wandb_project: MiMoSe
wandb_entity: null
wandb_mode: online
wandb_run_name: manymimosaskd23
push_to_hf: true
hf_repo: /path/to/huggingface/owner-repo

# testing (checkpoint is a plain ManyMimosas -- pass --model manymimosas)
checkpoint_path: /path/to/artifacts/manymimosaskd23/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/manymimosaskd_23/results.txt
