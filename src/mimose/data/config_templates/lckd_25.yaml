# Combined LCKD reference config for BraTS 2025.
# This mirrors legacy LCKD defaults as closely as possible under the
# current MiMoSe CLI/config API.
#
# Note: legacy LCKD (repo folder name; the live model class is "DualNet")
# is a single weight-shared, per-modality ResNet50+ASPP encoder/U-Net
# decoder (not a teacher/student pair of full networks despite the "KD" in
# the name). Its namesake mechanism is a feature-level self-distillation
# regularizer: legacy dynamically picks the current best-performing
# modality (via periodic validation-set Dice scoring) as a "teacher" and
# L1-distills its bottleneck feature into every other present modality.
# That curriculum doesn't fit MiMoSe's per-batch trainer contract, so this
# port replaces it with a fixed, symmetric scheme where every present
# modality distills into every other present modality equally, every
# step. Legacy's 3-channel BraTS-region (ET/WT/TC) sigmoid/BCE+Dice output
# is also replaced with a standard softmax num_cls-channel head (reusing
# softmax_weighted_loss/dice_loss from losses/imfuse.py), and legacy's
# batch-global modality "mode" string is replaced with MiMoSe's true
# per-sample [B, 4] mask. See docs/training.md for the full rationale.
# The full-modality warmup phase is kept, though: custom_trainer_kwargs.
# warmup_fraction (0-1) sets how much of num_epochs is spent training with
# all modalities present (masking_mode forced to "full") before switching
# to train_masking_mode for the rest of training.
# LCKDTrainer infers the current phase from the epoch index alone, so it
# also resumes into the correct phase automatically.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/lckd-preprocessed/
dataset_type: brats25

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/lckd-preprocessed
art_dir: /path/to/artifacts/lckd25
results_dir: /path/to/results/lckd_25

trainer: lckd
model: lckd
loss: lckd

custom_model_kwargs:
  num_cls: 5

custom_loss_kwargs:
  kd_weight: 0.1
  eps: 0.001
  log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  patch_size: 128
  debug: false
  transform_kind: imfuse
  train_masking_mode: random
  val_masking_mode: validation
  warmup_fraction: 0.41

optimizer: sgd
betas: [0.9, 0.999]
momentum: 0.99
nesterov: true

scheduler: poly
poly_total_iters: 980
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.01
num_epochs: 980
validation_every: 10
batch_size: 6
weight_decay: 0.0005
num_workers: 8
fp16: false
compile: false

resume: false
pretrain: null
seed: 999

wandb_project: SegmentationMM
wandb_mode: online
wandb_run_name: lckd25_training
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/lckd25/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/lckd_25/results.txt
