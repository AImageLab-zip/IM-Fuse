# Combined MST-KDNet reference config for BraTS 2025.
# This mirrors legacy MST-KDNet defaults as closely as possible under the
# current MiMoSe CLI/config API.
#
# Note: legacy MST-KDNet co-trains two full-weight instances of the same
# Myronenko-3D-UNet-with-UNETR-bottleneck backbone: a "full" branch (always
# sees the true unmasked 4-channel volume) and a "missing" branch (sees the
# volume zero-filled per the modality mask), with several distillation
# losses (bottleneck content MSE, UNETR intermediate-feature MSE, attention
# extreme-value distillation, logit-standardized KL, Gram-matrix style/GSM
# matching) pulling the missing branch toward the full one. Only the
# missing branch is ever evaluated at inference. This port drops legacy's
# adversarial style discriminator (a minor, 2e-4-weighted auxiliary whose
# optimizer legacy reconstructs from scratch every iteration, discarding its
# momentum state — almost certainly an unintentional bug, not worth
# preserving) and fixes a batch-size-1 assumption baked into legacy's own
# mask-broadcasting code. See docs/training.md for the full rationale.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/mstkdnet-preprocessed/
dataset_type: brats25

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/mstkdnet-preprocessed
art_dir: /path/to/artifacts/mstkdnet25

trainer: mstkdnet
model: mstkdnet
loss: mstkdnet

custom_model_kwargs:
  num_cls: 5

custom_loss_kwargs:
  weight_mispath: 0.6
  weight_content: 0.2
  weight_gsm: 100000000000.0
  unetr_weight: 0.2
  evd_weight: 100000000.0
  slkd_temperature: 7.0
  consistency_max_weight: 10.0
  consistency_rampup_epochs: 20.0

custom_trainer_kwargs:
  iter_per_epoch: null
  patch_size: 128
  debug: false
  transform_kind: imfuse
  train_masking_mode: random
  val_masking_mode: validation

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 250
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0001
num_epochs: 250
batch_size: 1
weight_decay: 0.00001
num_workers: 8
fp16: true

resume: false
pretrain: null
seed: 999

wandb_project: SegmentationMM
wandb_mode: online
wandb_run_name: mstkdnet25_training
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/mstkdnet25/checkpoints/final_weights_only.safetensors
output_path: /path/to/artifacts/mstkdnet25/results.txt
