# Combined TinyMimosa reference config for BraTS 2018.
# TinyMimosa currently reuses the IMFuse-style trainer/data path, but uses its
# own model and loss. This template reflects the current repo wiring rather than
# the older experimental draft config under src/mimose/data/configs/.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/tinymimosa-preprocessed/
dataset_type: brats18

crop_mode: none
crop_size: null
crop_min_size: null

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/tinymimosa-preprocessed
art_dir: /path/to/artifacts/tinymimosa18

trainer: imfuse
model: tinymimosa
loss: tinymimosa

custom_model_kwargs:
  num_cls: 4

custom_loss_kwargs:
  dice_weight: 0.5
  ce_weight: 0.5
  eps: 1e-4

custom_trainer_kwargs:
  transform_kind: tinymimosa
  train_masking_mode: random
  val_masking_mode: validation

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 500
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0002
num_epochs: 500
batch_size: 2
weight_decay: 0.0001
num_workers: 8
fp16: true

resume: false
pretrain: null
seed: 999

wandb_project: SegmentationMM
wandb_mode: online
wandb_run_name: tinymimosa18_training
push_to_hf: true
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/tinymimosa18/checkpoints/final_weights_only.safetensors
output_path: /path/to/artifacts/tinymimosa18/results.txt
