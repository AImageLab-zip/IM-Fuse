# Combined UNET-MFI reference config for BraTS 2023.
# This mirrors legacy UNET-MFI defaults as closely as possible under the
# current MiMoSe CLI/config API.
#
# Note: UNET-MFI's forward() returns exactly the (fuse_pred, sep_preds,
# prm_preds) tuple IMFuseTrainer/IMFuseLoss expect (4 independent
# per-modality U-Net towers, cross-informed at 5 resolutions by a
# Modality-adaptive Feature Interaction block, with a fused conv over the 4
# towers' final logits and 2 deep-supervision stages per tower), so this
# port reuses IMFuseTrainer/IMFuseLoss verbatim rather than writing new
# ones. See docs/training.md for the full rationale and the dead-code bug
# this port fixes.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/unetmfi-preprocessed/
dataset_type: brats23

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/unetmfi-preprocessed
art_dir: /path/to/artifacts/unetmfi23
results_dir: /path/to/results/unetmfi_23

trainer: imfuse
model: unetmfi
loss: imfuse

custom_model_kwargs:
  num_cls: 4

custom_loss_kwargs:
  num_classes: null
  fuse_weight: 1.0
  sep_weight: 1.0
  prm_weight: 1.0
  eps: 0.0000001
  log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  region_fusion_start_epoch: 0
  patch_size: 128
  debug: false
  transform_kind: imfuse
  train_masking_mode: random
  val_masking_mode: validation

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 1200
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0001
num_epochs: 1200
validation_every: 10
batch_size: 2
weight_decay: 0.00001
num_workers: 8
fp16: true
compile: false

resume: false
pretrain: null
seed: 999

wandb_project: SegmentationMM
wandb_mode: online
wandb_run_name: unetmfi23_training
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/unetmfi23/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/unetmfi_23/results.txt
