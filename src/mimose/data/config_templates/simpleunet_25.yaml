# Combined SimpleUnet reference config for BraTS 2025.
# SimpleUnet is TinyMimosa's identical backbone (see
# mimose.models.simple_unet), trained on 128x128x128 patches with
# IM-Fuse-style preprocessing/cropping instead of TinyMimosa's whole-volume
# pad-to-fit path -- reuses TinyMimosa's loss unchanged.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/simpleunet-preprocessed/
dataset_type: brats25

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/simpleunet-preprocessed
art_dir: /path/to/artifacts/simpleunet25
results_dir: /path/to/results/simpleunet_25

trainer: imfuse
model: simpleunet
loss: tinymimosa

custom_model_kwargs:
  num_cls: 5
  input_shape: [128, 128, 128]

custom_loss_kwargs:
  dice_weight: 0.5
  ce_weight: 0.5
  eps: 0.001

custom_trainer_kwargs:
  transform_kind: imfuse
  patch_size: 128
  train_masking_mode: random
  val_masking_mode: validation

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 500
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0016
num_epochs: 500
validation_every: 10
batch_size: 16
weight_decay: 0.0001
num_workers: 8
fp16: true
compile: false

resume: false
pretrain: null
seed: 0

fold: 1
wandb_project: MiMoSe
wandb_entity: null
wandb_mode: online
wandb_run_name: simpleunet25
push_to_hf: true
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/simpleunet25/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/simpleunet_25/results.txt
