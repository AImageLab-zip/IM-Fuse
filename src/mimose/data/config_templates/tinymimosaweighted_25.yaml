# Combined TinyMimosa (dynamically class-weighted loss) reference config for BraTS 2025.
# TinyMimosa currently reuses the IMFuse-style trainer/data path, but uses its
# own model and loss. This template reflects the current repo wiring for the
# full-volume TinyMimosa path.
#
# This is identical to the plain tinymimosa_25 config except for the loss: it
# swaps TinyMimosaLoss's unweighted cross-entropy for TinyMimosaWeightedLoss,
# which reuses IMFuse's per-sample per-class dynamic weighting
# (softmax_weighted_loss) to counter BraTS's background/tumor class
# imbalance. The model itself (model: tinymimosa) and everything else are
# unchanged, so results are directly comparable to the unweighted config.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/tinymimosa-preprocessed/
dataset_type: brats25

crop_mode: none
crop_size: null
crop_min_size: null

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/tinymimosa-preprocessed
art_dir: /path/to/artifacts/tinymimosaweighted25
results_dir: /path/to/results/tinymimosaweighted_25

trainer: imfuse
model: tinymimosa
loss: tinymimosaweighted

custom_model_kwargs:
  num_cls: 5

custom_loss_kwargs:
  dice_weight: 0.5
  ce_weight: 0.5
  eps: 0.001
  log_clamp_min: 0.005

custom_trainer_kwargs:
  transform_kind: tinymimosa
  train_masking_mode: random
  val_masking_mode: validation

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 1000
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0016
num_epochs: 1000
validation_every: 10
batch_size: 16
weight_decay: 0.0001
num_workers: 8
fp16: true
compile: false

resume: false
pretrain: null
seed: 999

fold: 1
wandb_project: MiMoSe
wandb_entity: null
wandb_mode: online
wandb_run_name: tinymimosaweighted25
push_to_hf: true
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/tinymimosaweighted25/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/tinymimosaweighted_25/results.txt
