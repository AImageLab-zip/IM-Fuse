# Combined MambaVit-AKD reference config for BraTS 2025.
# This mirrors legacy MambaVit-AKD defaults as closely as possible under the
# current MiMoSe CLI/config API.
#
# Note: legacy MambaVit-AKD's live model (repo folder name; the class is
# model_mamba_modalitys.Model) is architecturally identical to this
# codebase's RFNet port (see src/mimose/models/rfnet.py) -- same 4
# per-modality encoders, region-aware-fusion "Decoder_fuse", shared
# "Decoder_sep" -- plus a Mamba (mamba_ssm) encoder branch whose output is
# computed every forward call but never actually consumed by the decoder
# (confirmed dead code in legacy's own model_mamba_modalitys.py::Model.forward),
# so it is not ported. On top of the RFNet-style architecture, legacy
# distills a separately-pretrained, frozen RFNet ("model_RFNet.Model")
# teacher into the student via three losses (KD/prototype/attention). This
# codebase's trainer has no notion of loading a second, externally-pretrained
# model, so -- mirroring how MSTKDNet was already adapted here -- the
# teacher is embedded as a second submodule and trained jointly with the
# student in a single run; see src/mimose/models/mambavitakd.py and
# src/mimose/losses/mambavitakd.py docstrings for the full rationale.
#
# Like RFNet/A2FSeg/IMFuse in this codebase, this port uses the codebase's
# 80^3 patch size instead of legacy's 96^3, and reuses the IMFuseTrainer
# training contract directly (region_fusion_start_epoch curriculum included)
# since the student/teacher fuse+sep+prm segmentation losses match that
# contract's shape; the KD/prototype/attention terms are folded into the
# custom MambaVitAKDLoss on top.

# preprocess
input_dir: /path/to/unpacked
output_dir: /path/to/preprocessed/mambavitakd-preprocessed/
dataset_type: brats25

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /path/to/preprocessed/mambavitakd-preprocessed
art_dir: /path/to/artifacts/mambavitakd25
results_dir: /path/to/results/mambavitakd_25

trainer: imfuse
model: mambavitakd
loss: mambavitakd

custom_model_kwargs:
  num_cls: 5

custom_loss_kwargs:
  num_classes: null
  fuse_weight: 1.0
  sep_weight: 1.0
  prm_weight: 1.0
  teacher_weight: 1.0
  kd_weight: 10.0
  proto_weight: 0.1
  attn_weight: 0.1
  temperature: 10.0
  eps: 0.001
  log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  region_fusion_start_epoch: 60
  patch_size: 80
  debug: false
  transform_kind: imfuse
  train_masking_mode: random
  val_masking_mode: validation

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 300
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.00001
num_epochs: 300
validation_every: 10
batch_size: 2
weight_decay: 0.0001
num_workers: 8
fp16: true
compile: false

resume: false
pretrain: null
seed: 999

wandb_project: SegmentationMM
wandb_mode: online
wandb_run_name: mambavitakd25_training
push_to_hf: false
hf_repo: /path/to/huggingface/owner-repo

# testing
checkpoint_path: /path/to/artifacts/mambavitakd25/checkpoints/final_weights_only.safetensors
output_path: /path/to/results/mambavitakd_25/results.txt
