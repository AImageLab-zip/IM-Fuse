# pareto_flops_23 = budget-conditioned ElasticUnet supernet, budgeted on FLOPs.
#
# One set of shared weights serves a whole range of parameter budgets. Each
# optimizer step samples `budgets_per_step` budgets, evaluates the matching
# subnetworks on the same batch, and steps once on the accumulated gradient.
#
# Differs from pareto_23.yaml in exactly one respect that matters: the budget
# counts multiply-accumulates instead of parameters.
#
# Why: pareto_23 produced no Pareto front. Across its 16.6x *parameter* range the
# realized compute spanned only 1.12 .. 1.70 TMACs (1.5x) and whole-volume
# latency 0.896 .. 1.046 s (16%), and test ETpp was flat from 5M upward
# (0.7682 -> 0.7688). The reason is structural: parameters concentrate in the
# deep low-resolution stages, MACs in the shallow high-resolution ones, so a
# parameter penalty always takes its cuts where they cost no time. At init that
# supernet spanned 61x in MACs; training collapsed it to 1.5x.
#
# Budgeting MACs makes the penalty bite on stage-0 width, where d(MACs)/d(width)
# is ~2000x larger than at the bottleneck.
#
# Preprocessing is byte-identical to pareto_23 (same data_dir), so the two runs
# are directly comparable and against the mimosa_[size] sweep.

# preprocess
input_dir: /work/phd_mimose/unpacked
output_dir: /work/phd_mimose/mimosa_preprocessed
dataset_type: brats23

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /work/phd_mimose/mimosa_preprocessed
art_dir: /work/phd_mimose/runs/paretoflops23
results_dir: /work/phd_mimose/results/pareto_flops_23

trainer: pareto
model: elasticunet
loss: tinymimosa

custom_model_kwargs:
  num_cls: 4
  input_shape: [128, 128, 128]
  features_per_stage: [128, 256, 512, 1024, 2048]  # the widest architecture
  group_size: 4        # channel granularity of the gates
  tau: 0.05            # overwritten each epoch by the trainer's anneal
  budget_metric: flops # budgets count MACs of one 128^3 forward, not parameters
  # Floor = uniform 1/16 of the *previous* supernet (4,8,16,32,64) = 8.341 GMACs
  # (~0.36M params). Ceiling is left unset so it defaults to the full-width
  # supernet: 7.610 TMACs / ~365M params -- a 912x range, against pareto_23's
  # realized 1.5x.
  #
  # The ceiling had to be raised by *widening*, not deepening: a sixth stage
  # would add 4x the parameters (91M -> 366M) and only 3% more compute, because
  # a new bottleneck level runs at 1/8 the spatial volume of the one above it.
  budget_min: 8341422080

custom_loss_kwargs:
  dice_weight: 0.5
  ce_weight: 0.5
  eps: 0.001

custom_trainer_kwargs:
  transform_kind: imfuse
  patch_size: 128
  train_masking_mode: random
  val_masking_mode: validation
  # --- multi-budget training ---
  budgets_per_step: 3        # subnets per step; cost scales linearly
  # sandwich, not local: pareto_23 used local and its gates saturated well short
  # of full width (nominal 91.4M realized only 23.7M), consistent with the top of
  # the range rarely being sampled. Sandwich pins both endpoints every step.
  budget_sampling: sandwich  # local | global | sandwich (Phase 5 compares these)
  local_window_ratio: 1.5    # unused by sandwich; kept for ablation parity
  lambda_param: 1.0          # weight of the budget-overshoot penalty
  # --- inplace distillation (BigNAS) ---
  # The widest subnetwork is evaluated first each step and its detached output
  # becomes a soft target for the narrower ones. This is the half of the
  # sandwich rule pareto_23 was missing: sandwich guarantees the extremes get
  # gradient, distillation makes that gradient informative for the small end,
  # where a one-hot label is a much harsher target than the teacher's
  # distribution. Free in compute -- the teacher forward is already run.
  inplace_distill: true
  distill_alpha: 0.5         # 1.0 = pure BigNAS (students never see the label)
  tau_start: 0.5             # gate temperature, annealed geometrically ...
  tau_end: 0.02              # ... to here over num_epochs
  gate_lr_scale: 1.0         # LR multiplier for the gate thresholds

optimizer: adamw
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 1000
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

# batch_size/lr are inherited from pareto_23 (and thence mimosa_gargantuan), but
# note the equivalence argument no longer holds: at 2x width the widest
# subnetwork is 365,398,416 parameters / 7.610 TMACs, four times gargantuan, so
# the top of this range has no standalone twin in the mimosa_[size] sweep.
#
# Memory is the open risk. The budgets_per_step passes are sequential and each
# graph is freed before the next, so peak usage is still a single full-width
# forward+backward -- but that forward is now 2x the activations and 4x the
# parameters of the run that was validated at batch_size 3, and sandwich
# sampling means the full-width pass happens on *every* step rather than
# occasionally. If the first job OOMs, drop batch_size to 2 before touching
# anything else.
lr: 0.0003
num_epochs: 1000
validation_every: 10
batch_size: 3
weight_decay: 0.0001
num_workers: 12
precision: bf16
compile: false

resume: false
pretrain: null
seed: 999

fold: 1
wandb_project: ParetoMM
wandb_entity: homarone-unimore
wandb_mode: online
wandb_run_name: paretoflops23
push_to_hf: true
hf_repo: AImageLab-Zip/MiMoSe

# testing
checkpoint_path: /work/phd_mimose/runs/paretoflops23/checkpoints/final_weights_only.safetensors
output_path: /work/phd_mimose/results/pareto_flops_23/results.txt
