# Combined mmFormer reference config for BraTS 2023.
# This mirrors legacy mmFormer defaults as closely as possible under the current
# MiMoSe CLI/config API.
#
# Note: MiMoSe currently reuses the IMFuse-style trainer/loss/data pipeline
# for mmFormer because the legacy training loop and loss decomposition are the
# same. The key legacy differences reflected here are model selection, optimizer,
# scheduler, and default optimization hyperparameters.

# preprocess
input_dir: /work/grana_neuro/MICCAI_BraTS_2018_Data_Training
output_dir: /work/grana_neuro/brainchmark/mmformer18-preprocessed
dataset_type: brats18

crop_mode: non_empty
crop_size: null
crop_min_size: [128, 128, 128]

clamp_mode: none
clamp_percentile: null
clamp_min: null
clamp_max: null

norm_mode: subject_zscore
norm_min_max_range: null
norm_mean: null
norm_std: null

yes: false

# training
data_dir: /work/grana_neuro/brainchmark/mmformer18-preprocessed
art_dir: /work/grana_neuro/brainchmark/runs/mmformer18

trainer: imfuse
model: mmformer
loss: imfuse

custom_model_kwargs:
  num_cls: 4

#custom_loss_kwargs: {}
loss_num_classes: null
fuse_weight: 1.0
sep_weight: 1.0
prm_weight: 1.0
loss_eps: 0.0000001
log_clamp_min: 0.005

custom_trainer_kwargs:
  iter_per_epoch: null
  region_fusion_start_epoch: 0
  patch_size: 128
  debug: false
  transform_kind: imfuse

optimizer: adam
betas: [0.9, 0.999]
momentum: 0.9

scheduler: poly
poly_total_iters: 1000
poly_power: 0.9
cosine_t_max: null
cosine_eta_min: null
step_step_size: null
step_gamma: null
multistep_milestones: null
multistep_gamma: null
plateau_mode: null
plateau_factor: null
plateau_patience: null

lr: 0.0008
num_epochs: 1000
batch_size: 8
weight_decay: 0.0001
num_workers: 8
fp16: true

resume: false
pretrain: null
seed: 999

wandb_project: SegmentationMM
wandb_mode: online
wandb_run_name: mmformer18_training

# testing
checkpoint_path: /work/grana_neuro/brainchmark/runs/mmformer18/checkpoints/model_last.pth
output_path: /work/grana_neuro/brainchmark/runs/mmformer18/results.txt
