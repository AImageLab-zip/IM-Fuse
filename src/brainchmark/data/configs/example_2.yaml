# Example preprocess config
input_dir: /path/to/brats23
output_dir: /path/to/preprocessed
dataset_type: brats23

# Cropping
crop_mode: center
crop_size: [128, 128, 128]

# Clamping
clamp_mode: subject
clamp_percentile: [0.5, 99.5]

# Normalization
norm_mode: min_max
norm_min_max_range: [0.0, 1.0]

# Prompts
yes: false
