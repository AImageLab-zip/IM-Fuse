# Example preprocess config
input_dir: /storage/datasets/BraTS-GLI-2023-train/
output_dir: /storage/datasets/test-brainchmark/
dataset_type: brats23

# Cropping
crop_mode: center
crop_size: [128,128,128]
crop_min_size: null

# Clamping
clamp_mode: subject
clamp_percentile: [0.5, 99.5]
clamp_min: null
clamp_max: null

# Normalization
norm_mode: min_max
norm_min_max_range: [0.0, 1.0]
norm_mean: null
norm_std: null

# Prompts
yes: false
