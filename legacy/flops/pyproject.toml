[project]
name = "legacy-flops"
version = "0.1.0"
requires-python = "===3.11.9"
description = "Standalone CUDA-only FLOPs profiler for IM-Fuse legacy models."
dependencies = [
  "batchgenerators>=0.21",
  "complexPyTorch==0.4",
  "detectron2",
  "einops>=0.8",
  "h5py>=3.16.0",
  "matplotlib>=3.10",
  "medpy>=0.5",
  "monai>=1.2",
  "nibabel>=5.3",
  "numpy>=1.26",
  "ptflops>=0.7.5",
  "pyyaml>=6.0",
  "rich>=14.3.3",
  "simpleitk>=2.4",
  "tensorboardX>=2.6",
  "thop==0.1.1.post2209072238",
  "timm>=0.6.13",
  "torch==2.7.1",
  "torchvision>=0.22.1",
  "tqdm>=4.67",
  "transformers>=4.48",
  "wandb>=0.23",
]

[project.scripts]
legacy-flops = "legacy.flops.__main__:main"

[tool.uv.sources]
detectron2 = { git = "https://github.com/facebookresearch/detectron2.git" }
